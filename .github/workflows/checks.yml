name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s nibe_comfort/tests -v
      - run: node --check nibe_comfort/static/app.js && node --check nibe_comfort/static/theme.js
      - run: node nibe_comfort/tests/test_discovery_ui.cjs
      - run: docker build --tag nibe-comfort:test nibe_comfort
